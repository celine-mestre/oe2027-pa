name: Atualizar PA ao OE 2027

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "config.json", "data/taxonomia.json", "data/classificacao_manual.csv", "data/medidas_anunciadas.csv", "requirements.txt", ".github/workflows/atualizar.yml"]
  schedule:
    # Horas em UTC (= hora de Lisboa até março). Cadência ajustada ao calendário oficial do OE 2027:
    # mais capturas no último dia do prazo e nos dias de votação.
    # Prazo de entrega (29 out. – 6 nov.): 2 capturas por dia; 5 nov. de 2 em 2 horas; 6 nov. de hora a hora
    - cron: "15 7,19 29-31 10 *"
    - cron: "15 7,19 1-4 11 *"
    - cron: "0 8-22/2 5 11 *"
    - cron: "5 7-23 6 11 *"
    # Depois do prazo: publicação dos registos continua no fim de semana; 9 nov. cobre o plano de contingência (+24 h úteis)
    - cron: "20 0,2,5,8,11,14,17,20,23 7-8 11 *"
    - cron: "5 7-23 9 11 *"
    # Guiões e preparação das votações
    - cron: "15 7,19 10-17 11 *"
    # Votações na COFAP (15h00) e votação final global
    - cron: "10 7,13,16-23 18-20,23-24 11 *"
    - cron: "15 7,19 25-30 11 *"
    - cron: "15 7 1-11 12 *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-pa
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Extrair dos dados abertos da AR
        id: opendata
        continue-on-error: true
        run: python scripts/fetch_pa.py opendata

      - name: Reserva — pesquisa de PA no parlamento.pt
        if: steps.opendata.outcome != 'success'
        continue-on-error: true
        run: python scripts/fetch_pa.py scrape

      - name: Gerar painel
        run: python scripts/build_painel.py

      - name: Guardar dados e painel no repositório
        run: |
          git config user.name "upe-sggov-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "captura $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      - name: Publicar no GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
