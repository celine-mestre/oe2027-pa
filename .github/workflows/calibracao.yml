name: Calibração e carga do OE 2026

# Manual, ou ao alterar este ficheiro. Faz o que não precisa de correr em cada captura:
#   1. lista a pasta XVII dos dados abertos e descarrega o calendário e o texto das propostas de lei;
#   2. carrega (ou atualiza) a base do OE 2026, processo concluído, a partir dos dados abertos da AR;
#   3. exporta os Excel e publica o painel.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/calibracao.yml"]   # corre também quando este ficheiro é alterado

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-pa
  cancel-in-progress: false

jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Trazer o estado mais recente do repositório (o checkout é feito ao commit que disparou o workflow)
        run: git pull --ff-only origin main || true

      - name: Pasta XVII, calendário e texto das propostas de lei
        continue-on-error: true
        run: python scripts/descobrir.py

      - name: OE 2026 — dados abertos (processo concluído)
        continue-on-error: true
        run: python scripts/fetch_pa.py opendata --ano 2026

      - name: OE 2026 — documentos da página da COFAP
        continue-on-error: true
        run: python scripts/fetch_pa.py documentos --ano 2026

      - name: Excel e painel
        run: |
          python scripts/exportar_dados.py --ano 2026
          python scripts/exportar_dados.py --ano 2027
          python scripts/build_painel.py

      - name: Guardar no repositório
        run: |
          git config user.name "upe-sggov-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "calibração $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "envio recusado (tentativa $i); nova tentativa em 10 s"; sleep 10
          done
          exit 1

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
