name: Teste da reserva (temporário)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/testar_reserva.py"]
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/testar_reserva.py
      - name: Guardar resumo num ramo temporário
        run: |
          git config user.name "upe-sggov-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan testes
          git rm -rq --cached .
          git add teste_reserva.json
          git commit -qm "resumo do teste da reserva"
          git push -f origin testes
